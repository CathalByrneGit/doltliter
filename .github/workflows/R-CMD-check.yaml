name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The install strategy is the fragile part of this package, not the R code,
  # so the matrix is organised around it: each job pins one strategy on one
  # platform and fails if configure silently picks a different one.
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }} / ${{ matrix.config.strategy }}
    # Without this a job that never finds a runner keeps the whole run in
    # "queued" indefinitely, so nothing ever reports.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          # Linux x86_64: a system install, the cheapest path.
          - {os: ubuntu-latest,  r: 'release', strategy: system,   error_on: warning}
          # Linux x86_64: the vendored amalgamation, i.e. the CRAN path.
          - {os: ubuntu-latest,  r: 'release', strategy: vendor,   error_on: error}
          # Linux x86_64: the release library download.
          - {os: ubuntu-latest,  r: 'release', strategy: download, error_on: warning}
          - {os: ubuntu-latest,  r: 'oldrel-1', strategy: system,  error_on: warning}
          # Apple Silicon: a prebuilt osx-arm64 library exists.
          - {os: macos-latest,   r: 'release', strategy: download, error_on: warning}
          # Intel macOS has no published lib asset at all, so it must vendor.
          # Note the runner label: macos-13 is retired, and a job asking for a
          # retired label never gets picked up -- it sits queued forever and
          # the whole run never reaches a conclusion, which is worse than a
          # visible failure. macos-15-intel is the current Intel runner.
          - {os: macos-15-intel, r: 'release', strategy: vendor,   error_on: error}
          # Windows ships only a DLL with no import library, so it must vendor.
          - {os: windows-latest, r: 'release', strategy: vendor,   error_on: error}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DOLTLITER_STRATEGY: ${{ matrix.config.strategy }}
      # DBItest's round-trip fixtures contain non-ASCII text.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install DoltLite (system strategy only)
        if: matrix.config.strategy == 'system'
        run: |
          sudo bash -c 'curl -fsSL https://github.com/dolthub/doltlite/releases/latest/download/install.sh | bash'
          doltlite :memory: "SELECT dolt_version();"
        shell: bash

      - name: Stage the amalgamation (vendor strategy only)
        if: matrix.config.strategy == 'vendor'
        run: Rscript tools/vendor_amalgamation.R
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"${{ matrix.config.error_on }}"'

      # The vendor strategy compiles DoltLite's generated amalgamation, which
      # carries diagnostic-suppressing pragmas, so R CMD check reports
      #
      #   checking pragmas in C/C++ headers and code ... WARNING
      #
      # That is a true statement about vendored upstream code, not a defect in
      # this package, and it cannot be fixed without editing third-party
      # generated source. So warnings are not fatal on those jobs -- but that
      # must not become a blanket amnesty, hence this guard: any warning other
      # than the pragma one still fails the build.
      - name: Allow only the known pragma warning
        if: matrix.config.strategy == 'vendor'
        run: |
          log=$(find check -name '00check.log' | head -1)
          if [ -z "$log" ]; then echo "no check log found"; exit 1; fi
          unexpected=$(grep -E '^\* checking .* \.\.\. WARNING' "$log" \
                       | grep -v 'checking pragmas in C/C\+\+ headers and code' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected WARNING(s) beyond the known vendored-pragma one:"
            echo "$unexpected"
            exit 1
          fi
          echo "only the known vendored-pragma warning is present"
        shell: bash

      # check-r-package checks a tarball in its own directory and does not
      # leave the package on the library path, so install it before asking it
      # anything. Worth keeping per-platform: configure asserts the engine at
      # build time, but this proves it again from a real R session, on the
      # platforms the golden-file job does not cover.
      - name: Confirm the engine really is DoltLite
        run: |
          R CMD INSTALL .
          Rscript -e 'stopifnot(identical(doltliter::doltlite_engine(), "prolly"))' \
                  -e 'cat("engine ok\n")'
        shell: bash

  # Guard against binding drift as DoltLite releases new versions: run the
  # same operations through the CLI and through this package, and compare.
  golden-file:
    runs-on: ubuntu-latest
    name: golden file vs the doltlite CLI
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install DoltLite (CLI and library)
        run: sudo bash -c 'curl -fsSL https://github.com/dolthub/doltlite/releases/latest/download/install.sh | bash'
        shell: bash

      - name: Install the package
        run: R CMD INSTALL .
        shell: bash

      - name: Compare CLI output with doltliter output
        run: Rscript tools/golden_file_check.R
        shell: bash
