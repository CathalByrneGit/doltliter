name: Build and deploy package site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@HEAD

      # litedown itself needs no pandoc, which is why the template has no
      # setup step for it -- but the vignettes are still rmarkdown::html_vignette,
      # and R CMD build cannot render those without it.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@HEAD
        with:
          use-public-rspm: true
      # doltliter compiles against libdoltlite, and the step below builds and
      # installs the package, so the engine has to be here first -- otherwise
      # configure silently falls through to downloading one. Same retry as the
      # other workflows: unauthenticated release downloads are rate limited and
      # --retry alone does not cover a 403.
      - name: Install DoltLite
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o doltlite-install.sh \
            https://github.com/dolthub/doltlite/releases/latest/download/install.sh
          sudo bash doltlite-install.sh
          rm -f doltlite-install.sh
        shell: bash

      # Installs DESCRIPTION deps (incl. Suggests, so knitr/rmarkdown vignettes build),
      # then R CMD build + INSTALL the package itself (".") so vignettes land in doc/.
      - uses: yihui/actions/setup-r-dependencies@HEAD
        with:
          extra-packages: litedown xfun .
          r-universe: yihui
      - uses: yihui/actions/litedown-site@HEAD
        with:
          site-dir: 'site'
          # The action always copies litedown's template playground/ in. Keeping
          # it out of the nav is not enough -- the page would still be live at
          # /playground/ and fail, since doltliter links a compiled engine and
          # has no WASM binary to install. The default cleanup is extended, not
          # replaced: it still removes the rendered sources.
          cleanup: 'rm -f *.Rmd *.yml _* && rm -rf playground'

      # PR builds: upload the rendered site as a downloadable preview artifact.
      - if: github.event_name == 'pull_request'
        id: upload
        uses: actions/upload-artifact@HEAD
        with:
          name: site-preview
          path: 'site'

      # Link the preview from the PR's status checks (skipped for forks: read-only token).
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@HEAD
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              target_url: `${{ steps.upload.outputs.artifact-url }}`,
              description: 'Site preview artifact ready',
              context: 'Site preview'
            });

      # Pushes: replace the gh-pages branch contents with the new site.
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          tmp=$(mktemp -d)
          cp -r site/. "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git switch gh-pages
          else
            git switch --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp -r "$tmp"/. .
          git add -A
          git diff --cached --quiet || (git commit -m "deploy site" && git push origin gh-pages)
