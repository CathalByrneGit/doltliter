name: shellcheck

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: configure scripts
    steps:
      - uses: actions/checkout@v4
      - name: Check the configure scripts parse and lint
        run: |
          for f in configure configure.win cleanup; do
            echo "== $f"
            sh -n "$f"
          done
          sudo apt-get update && sudo apt-get install -y shellcheck
          # POSIX sh, and configure deliberately does not use `set -e`.
          shellcheck -s sh -S warning configure configure.win cleanup || true
        shell: bash
